<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="hud-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="chevron-glow" x="-24" y="-24" width="228" height="228" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#0a0a0a"/>
  <rect x="1" y="1" width="178" height="178" rx="35" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Ambient glow — centered -->
  <circle cx="90" cy="90" r="72" fill="url(#hud-glow)"/>

  <!-- HUD corner brackets — pushed into corners -->
  <path d="M16 42 L16 16 L42 16" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="square"/>
  <path d="M138 16 L164 16 L164 42" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="square"/>
  <path d="M16 138 L16 164 L42 164" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="square"/>
  <path d="M164 138 L164 164 L138 164" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="square"/>

  <!-- Outer ring — r=64 -->
  <circle cx="90" cy="90" r="64" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>

  <!-- Tick marks scaled to r=64 -->
  <g stroke="#2a2a2a" stroke-width="1">
    <!-- Cardinal -->
    <line x1="90" y1="26" x2="90" y2="34"/>
    <line x1="90" y1="154" x2="90" y2="146"/>
    <line x1="26" y1="90" x2="34" y2="90"/>
    <line x1="154" y1="90" x2="146" y2="90"/>
    <!-- Diagonal -->
    <line x1="44.8" y1="44.8" x2="50.5" y2="50.5"/>
    <line x1="135.2" y1="44.8" x2="129.5" y2="50.5"/>
    <line x1="44.8" y1="135.2" x2="50.5" y2="129.5"/>
    <line x1="135.2" y1="135.2" x2="129.5" y2="129.5"/>
  </g>

  <!-- Crosshair lines — full continuous through center -->
  <line x1="90" y1="26" x2="90" y2="154" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="26" y1="90" x2="154" y2="90" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Inner ring -->
  <circle cx="90" cy="90" r="27" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- First > — orange -->
  <path d="M60 66 L98.8 89.2 L98.8 90.8 L60 114" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" filter="url(#chevron-glow)"/>
  <!-- Second > — opaque gray with matching glow and a less clipped tip -->
  <path d="M80 66 L120.8 89.2 L120.8 90.8 L80 114" fill="none" stroke="#808080" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" filter="url(#chevron-glow)"/>

</svg>
