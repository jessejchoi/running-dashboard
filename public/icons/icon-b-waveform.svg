<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="wave-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="1"/>
      <stop offset="85%" stop-color="#f97316" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow-b">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip-b">
      <rect x="20" y="20" width="140" height="140" rx="4"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#0a0a0a"/>
  <rect x="1" y="1" width="178" height="178" rx="35" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Grid lines — terminal feel -->
  <g clip-path="url(#clip-b)" opacity="0.18">
    <line x1="20" y1="56" x2="160" y2="56" stroke="#f97316" stroke-width="0.5"/>
    <line x1="20" y1="90" x2="160" y2="90" stroke="#f97316" stroke-width="0.5"/>
    <line x1="20" y1="124" x2="160" y2="124" stroke="#f97316" stroke-width="0.5"/>
    <line x1="56" y1="20" x2="56" y2="160" stroke="#f97316" stroke-width="0.5"/>
    <line x1="90" y1="20" x2="90" y2="160" stroke="#f97316" stroke-width="0.5"/>
    <line x1="124" y1="20" x2="124" y2="160" stroke="#f97316" stroke-width="0.5"/>
  </g>

  <!-- Corner registration marks -->
  <path d="M20 34 L20 20 L34 20" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M146 20 L160 20 L160 34" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M20 146 L20 160 L34 160" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M160 146 L160 160 L146 160" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="square"/>

  <!-- Baseline -->
  <line x1="22" y1="110" x2="158" y2="110" stroke="#222" stroke-width="1"/>

  <!-- Waveform path — interval pace signal: flat / spike up / flat / spike up / flat -->
  <!-- Glow layer -->
  <polyline
    points="22,110 40,110 40,52 56,52 56,110 72,110 72,68 88,68 88,110 96,110 96,58 112,58 112,110 130,110 130,74 146,74 146,110 158,110"
    fill="none"
    stroke="#f97316"
    stroke-width="6"
    stroke-linejoin="miter"
    filter="url(#glow-b)"
    opacity="0.5"
  />
  <!-- Sharp signal line -->
  <polyline
    points="22,110 40,110 40,52 56,52 56,110 72,110 72,68 88,68 88,110 96,110 96,58 112,58 112,110 130,110 130,74 146,74 146,110 158,110"
    fill="none"
    stroke="url(#wave-fade)"
    stroke-width="2.5"
    stroke-linejoin="miter"
  />
  <!-- Bright core -->
  <polyline
    points="22,110 40,110 40,52 56,52 56,110 72,110 72,68 88,68 88,110 96,110 96,58 112,58 112,110 130,110 130,74 146,74 146,110 158,110"
    fill="none"
    stroke="#ffb080"
    stroke-width="1"
    stroke-linejoin="miter"
    opacity="0.6"
  />

  <!-- Dot markers at peaks -->
  <circle cx="48" cy="52" r="3" fill="#f97316" filter="url(#glow-b)"/>
  <circle cx="80" cy="68" r="3" fill="#f97316" filter="url(#glow-b)"/>
  <circle cx="104" cy="58" r="3" fill="#f97316" filter="url(#glow-b)"/>
  <circle cx="138" cy="74" r="3" fill="#f97316" filter="url(#glow-b)"/>

  <!-- Axis tick labels -->
  <text x="22" y="125" font-family="monospace" font-size="7" fill="#2e2e2e" letter-spacing="1">0</text>
  <text x="155" y="125" font-family="monospace" font-size="7" fill="#2e2e2e" text-anchor="end" letter-spacing="1">T</text>
</svg>
