<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <radialGradient id="hud-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-c">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#0a0a0a"/>
  <rect x="1" y="1" width="178" height="178" rx="35" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Ambient glow -->
  <circle cx="90" cy="90" r="70" fill="url(#hud-glow)"/>

  <!-- HUD corner brackets — outer -->
  <path d="M26 46 L26 26 L46 26" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="square"/>
  <path d="M134 26 L154 26 L154 46" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="square"/>
  <path d="M26 134 L26 154 L46 154" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="square"/>
  <path d="M154 134 L154 154 L134 154" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="square"/>

  <!-- Inner corner accents -->
  <path d="M38 56 L38 42 L52 42" fill="none" stroke="#2e2e2e" stroke-width="1" stroke-linecap="square"/>
  <path d="M142 42 L156 42 L156 56" fill="none" stroke="#2e2e2e" stroke-width="1" stroke-linecap="square"/>
  <path d="M38 124 L38 138 L52 138" fill="none" stroke="#2e2e2e" stroke-width="1" stroke-linecap="square"/>
  <path d="M142 138 L156 138 L156 124" fill="none" stroke="#2e2e2e" stroke-width="1" stroke-linecap="square"/>

  <!-- Outer ring -->
  <circle cx="90" cy="90" r="52" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
  <!-- Tick marks around ring -->
  <g stroke="#2a2a2a" stroke-width="1">
    <line x1="90" y1="34" x2="90" y2="42"/>
    <line x1="90" y1="138" x2="90" y2="146"/>
    <line x1="34" y1="90" x2="42" y2="90"/>
    <line x1="138" y1="90" x2="146" y2="90"/>
    <line x1="53.2" y1="53.2" x2="58.9" y2="58.9"/>
    <line x1="121.1" y1="53.2" x2="126.8" y2="58.9"/>
    <line x1="53.2" y1="126.8" x2="58.9" y2="121.1"/>
    <line x1="121.1" y1="126.8" x2="126.8" y2="121.1"/>
  </g>

  <!-- Crosshair lines — thin, technical -->
  <line x1="90" y1="52" x2="90" y2="70" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="90" y1="110" x2="90" y2="128" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="52" y1="90" x2="70" y2="90" stroke="#2a2a2a" stroke-width="1"/>
  <line x1="110" y1="90" x2="128" y2="90" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Inner ring -->
  <circle cx="90" cy="90" r="22" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- >> chevrons — centered at (90,90), butt caps for clean ends -->
  <path d="M63 70 L97 90 L63 110" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" filter="url(#glow-c)"/>
  <path d="M83 70 L117 90 L83 110" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="butt" stroke-linejoin="miter" filter="url(#glow-c)"/>

  <!-- Center dot -->
  <circle cx="90" cy="90" r="3" fill="#f97316"/>

  <!-- HUD data readouts -->
  <text x="26" y="22" font-family="monospace" font-size="6" fill="#2e2e2e" letter-spacing="2">SYS</text>
  <text x="154" y="22" font-family="monospace" font-size="6" fill="#2e2e2e" text-anchor="end" letter-spacing="2">ON</text>
</svg>
