<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <filter id="glow-d">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="needle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#0a0a0a"/>
  <rect x="1" y="1" width="178" height="178" rx="35" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Corner marks -->
  <path d="M18 30 L18 18 L30 18" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M150 18 L162 18 L162 30" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M18 150 L18 162 L30 162" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="square"/>
  <path d="M162 150 L162 162 L150 162" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="square"/>

  <!-- Arc track — 220° sweep, center 90,100, radius 62 -->
  <!-- Full arc background (dark) — from 200° to 340° clockwise = 220° sweep (bottom gap) -->
  <!-- Using: start 160° left, sweep 220° = 200deg to 340deg. Let's set start=(-110deg from top)=160deg, but SVG arcs...
       Let's use a circle with dasharray instead.
       circumference = 2*pi*62 ≈ 389.6
       220deg = 220/360 * 389.6 ≈ 238
       140deg gap = 140/360 * 389.6 ≈ 151.6
       dasharray="238 151.6" dashoffset calculated to start from bottom-left
       SVG 0° = 3 o'clock. We want arc from ~8 o'clock to ~4 o'clock (220° sweep), gap at bottom.
       Start at 8 o'clock = 240° from 3 o'clock = 240deg.
       dashoffset = -circumference * (240/360) = -389.6 * 0.667 = -259.8
  -->
  <circle cx="90" cy="100" r="62" fill="none" stroke="#191919" stroke-width="12"
    stroke-dasharray="238 151.6"
    stroke-dashoffset="-259.8"
  />

  <!-- Arc colored zones — zone 1: inactive -->
  <circle cx="90" cy="100" r="62" fill="none" stroke="#1e2e1e" stroke-width="12"
    stroke-dasharray="80 309.6"
    stroke-dashoffset="-259.8"
  />
  <!-- Zone 2: warning -->
  <circle cx="90" cy="100" r="62" fill="none" stroke="#2a2214" stroke-width="12"
    stroke-dasharray="80 309.6"
    stroke-dashoffset="-339.8"
  />
  <!-- Zone 3: active/orange -->
  <circle cx="90" cy="100" r="62" fill="none" stroke="#f97316" stroke-width="12"
    stroke-dasharray="78 311.6"
    stroke-dashoffset="-419.8"
    filter="url(#glow-d)"
    opacity="0.9"
  />

  <!-- Tick marks around arc — 11 major ticks -->
  <!-- Major ticks at 220deg arc, each 22deg apart -->
  <g stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="square">
    <!-- 240deg: -->  <line x1="59" y1="154.2" x2="63.5" y2="146.4"/>
    <!-- 262deg: -->  <line x1="33.5" y1="116.5" x2="39.2" y2="113.2"/>
    <!-- 284deg: -->  <line x1="29.4" y1="73.5" x2="35.8" y2="76.7"/>
    <!-- 306deg: -->  <line x1="50" y1="37.5" x2="54.5" y2="45.3"/>
    <!-- 328deg: -->  <line x1="83.5" y1="19.2" x2="85.3" y2="27.8"/>
    <!-- 350deg: -->  <line x1="118.5" y1="22.8" x2="117.2" y2="31.5"/>
    <!-- 12deg:  -->  <line x1="148.5" y1="44.5" x2="143.5" y2="52.0"/>
    <!-- 34deg:  -->  <line x1="165.5" y1="78.5" x2="158.9" y2="80.8"/>
    <!-- 56deg:  -->  <line x1="167" y1="118.5" x2="160.2" y2="115.8"/>
    <!-- 78deg:  -->  <line x1="150" y1="152" x2="145" y2="144.5"/>
  </g>

  <!-- Minor tick marks -->
  <g stroke="#222" stroke-width="1" stroke-linecap="square">
    <line x1="46.5" y1="138" x2="49.8" y2="132.5"/>
    <line x1="34" y1="96" x2="39.5" y2="96"/>
    <line x1="38" y1="55" x2="43.5" y2="58.5"/>
    <line x1="64.5" y1="26.5" x2="67.5" y2="34"/>
    <line x1="100" y1="19.5" x2="100.5" y2="28"/>
    <line x1="135" y1="28" x2="133" y2="35.5"/>
    <line x1="158.5" y1="60" x2="153" y2="63.5"/>
    <line x1="164" y1="99" x2="158.5" y2="99"/>
    <line x1="156" y1="136.5" x2="151" y2="131.5"/>
  </g>

  <!-- Inner ring -->
  <circle cx="90" cy="100" r="46" fill="none" stroke="#161616" stroke-width="1"/>
  <circle cx="90" cy="100" r="44" fill="none" stroke="#111" stroke-width="1"/>

  <!-- Needle — pointing to ~75% = ~325deg from 3 o'clock, which is roughly "fast zone" -->
  <!-- 325deg from 3 o'clock = needle tip: 90 + 50*cos(325°), 100 + 50*sin(325°) = 90+40.96, 100-28.68 = 131, 71.3 -->
  <!-- Needle base near center -->
  <line x1="90" y1="100" x2="128" y2="73" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-d)"/>
  <!-- Needle bright core -->
  <line x1="90" y1="100" x2="126" y2="74.5" stroke="#ffb347" stroke-width="1" stroke-linecap="round" opacity="0.8"/>

  <!-- Center hub -->
  <circle cx="90" cy="100" r="8" fill="#111" stroke="#2a2a2a" stroke-width="1.5"/>
  <circle cx="90" cy="100" r="4" fill="#f97316"/>
  <circle cx="90" cy="100" r="2" fill="#ffb347"/>

  <!-- Speed readout -->
  <text x="90" y="132" font-family="monospace" font-size="11" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="2">5:24</text>
  <text x="90" y="143" font-family="monospace" font-size="6.5" fill="#3a3a3a" text-anchor="middle" letter-spacing="3">/KM</text>
</svg>
